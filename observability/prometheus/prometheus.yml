global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App rodando no docker compose (serviço "app").
  - job_name: mvp-local
    static_configs:
      - targets: ["app:8000"]

  # MVP publicado no Azure Container Apps (só HTTPS). O FQDN vem de
  # `terraform -chdir=infra/terraform output -raw app_fqdn`.
  - job_name: mvp-prod
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["ca-akona-energy-prod.salmoncoast-770d275b.eastus2.azurecontainerapps.io:443"]
