services:
  app:
    build: .
    image: akona-energy-devops:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Observabilidade local. Subir com: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    # A senha do admin vem de GF_SECURITY_ADMIN_PASSWORD no .env.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
