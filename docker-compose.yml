services:
  app:
    build: .
    image: akona-energy-devops:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Os serviços prometheus e grafana entram no E6a, sob o profile observability:
  #   profiles: [observability]
  # Subir com: docker compose --profile observability up
